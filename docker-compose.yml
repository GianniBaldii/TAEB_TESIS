services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/dumps:/dumps
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
    command: python app/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/workspace
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  mobile:
    build:
      context: .
      dockerfile: mobile/Dockerfile
    restart: unless-stopped
    environment:
      IONIC_API_BASE_URL: ${IONIC_API_BASE_URL:-http://localhost:8000/api/v1/mobile}
    volumes:
      - ./mobile:/workspace/mobile
      - mobile_node_modules:/workspace/mobile/node_modules
    ports:
      - "${IONIC_PORT:-8100}:8100"
    depends_on:
      - backend

volumes:
  mysql_data:
  mobile_node_modules:
