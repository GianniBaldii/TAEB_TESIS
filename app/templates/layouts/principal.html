{% extends "base.html" %}

{% block body %}
<div
    x-data="{ barraAbierta: false }"
    class="min-h-screen bg-slate-100"
>
    <div
        x-cloak
        x-show="barraAbierta"
        x-transition.opacity
        class="fixed inset-0 z-30 bg-slate-950/50 lg:hidden"
        aria-hidden="true"
        @click="barraAbierta = false"
    ></div>

    <aside
        class="fixed inset-y-0 left-0 z-40 w-72 -translate-x-full transition-transform duration-200 lg:translate-x-0"
        :class="{ 'translate-x-0': barraAbierta, '-translate-x-full': !barraAbierta }"
        aria-label="Navegación principal"
    >
        {% include "parciales/barra_lateral.html" %}
    </aside>

    <div class="lg:pl-72">
        {% include "parciales/barra_superior.html" %}

        <main class="px-4 py-8 sm:px-6 lg:px-8">
            <div class="mx-auto max-w-7xl">
                {% block contenido %}{% endblock %}
            </div>
        </main>
    </div>
</div>
{% endblock %}
