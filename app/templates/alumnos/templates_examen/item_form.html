{% extends "layouts/principal.html" %}

{% block title %}Item | TAEB{% endblock %}

{% block contenido %}
<section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="mb-1 text-2xl font-bold text-slate-900">Item de evaluacion</h1>
    <p class="mb-6 text-sm text-slate-500">{{ seccion.nombre }} · {{ template_examen.nombre }}</p>
    <form method="post" class="grid gap-4 md:grid-cols-2">
        {% csrf_token %}
        {% include "alumnos/partials/form_fields.html" %}
        <div class="md:col-span-2 flex gap-2">
            <button class="rounded-lg bg-blue-700 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-800">Guardar</button>
            <a href="{% url 'alumnos:template_detail' template_examen.pk %}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Volver</a>
        </div>
    </form>
</section>
{% endblock %}
