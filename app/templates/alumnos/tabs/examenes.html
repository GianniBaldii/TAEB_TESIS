<div class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
    <table class="min-w-full divide-y divide-slate-200 text-sm">
        <thead class="bg-slate-50 text-left text-xs font-semibold uppercase text-slate-500">
            <tr><th class="px-4 py-3">Fecha</th><th class="px-4 py-3">Origen</th><th class="px-4 py-3">Destino</th><th class="px-4 py-3">Tipo</th><th class="px-4 py-3">Estado</th><th class="px-4 py-3">Nota</th><th class="px-4 py-3">Resultado</th><th class="px-4 py-3">Lugar</th><th class="px-4 py-3">Acciones</th></tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
            {% for examen in examenes %}
            {% include "alumnos/partials/examen_row.html" %}
            {% empty %}
            <tr><td colspan="9" class="px-4 py-8 text-center text-slate-500">Este alumno no tiene examenes registrados.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
