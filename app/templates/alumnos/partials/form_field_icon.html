<div class="{% if wrapper_class %}{{ wrapper_class }}{% endif %}">
    <label for="{{ field.id_for_label }}" class="mb-1.5 flex items-center gap-2 text-sm font-semibold text-slate-700">
        <i class="fa-solid {{ icon }} text-slate-400"></i>
        {{ field.label }}
        {% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
    </label>
    {{ field }}
    {% if help_text %}
        <p class="mt-1.5 text-xs leading-5 text-slate-500">{{ help_text }}</p>
    {% elif field.help_text %}
        <p class="mt-1.5 text-xs leading-5 text-slate-500">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
        <p class="mt-1.5 text-sm font-semibold text-red-600">{{ field.errors|striptags }}</p>
    {% endif %}
</div>
