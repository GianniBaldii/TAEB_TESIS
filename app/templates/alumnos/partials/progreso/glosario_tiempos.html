<section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm" x-data="{ abierto: true }">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <p class="text-sm font-semibold uppercase tracking-wide text-blue-700">Referencia orientativa</p>
            <h2 class="mt-1 text-2xl font-black text-slate-950">Tiempos de preparación por cinturón</h2>
        </div>
        <button type="button" @click="abierto = !abierto" class="rounded-full border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">
            <span x-show="abierto">Ocultar</span>
            <span x-show="!abierto">Ver referencia</span>
        </button>
    </div>

    <div x-show="abierto" x-transition class="mt-5 grid gap-3 md:grid-cols-2 xl:grid-cols-3">
        {% for item in analisis_trayectoria.glosario_tiempos %}
        <article class="rounded-xl border border-slate-200 bg-slate-50 p-4">
            <div class="flex items-start justify-between gap-3">
                <div>
                    <p class="font-bold text-slate-950">{{ item.nombre }}</p>
                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">{{ item.grado }}</p>
                </div>
                <span class="rounded-full border border-blue-200 bg-blue-50 px-2 py-1 text-xs font-bold text-blue-700">{{ item.tiempo }}</span>
            </div>
            <p class="mt-3 text-xs text-slate-500">Acumulado estimado: <span class="font-semibold text-slate-700">{{ item.acumulado }}</span></p>
        </article>
        {% endfor %}
    </div>

    <p class="mt-5 rounded-xl bg-amber-50 p-4 text-sm leading-6 text-amber-900">
        {{ analisis_trayectoria.referencia_texto }}
    </p>
</section>
