{% csrf_token %}
{% if form.non_field_errors %}<div class="flex gap-3 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"><i class="fa-solid fa-circle-exclamation mt-0.5"></i><div>{{ form.non_field_errors }}</div></div>{% endif %}
{% for field in form %}
<div class="space-y-1.5 {% if field.name == 'alumnos' or field.name == 'descripcion' or field.name == 'observaciones' %}md:col-span-2{% endif %}">
  <label class="flex items-center justify-between text-sm font-bold text-slate-700" for="{{ field.id_for_label }}"><span>{{ field.label }}</span>{% if field.field.required %}<span class="text-xs font-medium text-slate-400">Obligatorio</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="text-xs leading-relaxed text-slate-500">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="flex items-center gap-1 text-sm font-medium text-red-600"><i class="fa-solid fa-circle-exclamation"></i>{{ error }}</p>{% endfor %}
</div>
{% endfor %}
