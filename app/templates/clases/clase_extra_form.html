{% extends "layouts/principal.html" %}

{% block title %}Clase extra | TAEB{% endblock %}

{% block contenido %}
<section class="space-y-5">
    <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="border-b border-slate-100 bg-gradient-to-r from-blue-50 via-white to-slate-50 p-6">
            <div class="flex items-center gap-4">
                <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-700 text-xl text-white shadow-sm">
                    <i class="fa-solid fa-star"></i>
                </div>
                <div>
                    <a href="{% url 'clases:clase_detail' clase.pk %}" class="text-sm font-semibold text-blue-700 hover:text-blue-900"><i class="fa-solid fa-arrow-left mr-1"></i>Volver a {{ clase.nombre }}</a>
                    <h1 class="mt-1 text-2xl font-black text-slate-950">Clase extra</h1>
                    <p class="mt-1 text-sm text-slate-500">Creá una sesión puntual fuera de los horarios recurrentes.</p>
                </div>
            </div>
        </div>

        <form method="post" class="p-6">
            {% csrf_token %}
            <div class="grid gap-5 md:grid-cols-2">
                {% for field in form %}
                <label class="{% if field.name == 'observaciones' %}md:col-span-2{% endif %}">
                    <span class="mb-1 flex items-center gap-2 text-sm font-bold text-slate-700">
                        {% if field.name == "fecha" %}<i class="fa-solid fa-calendar-day text-slate-400"></i>
                        {% elif "hora" in field.name %}<i class="fa-solid fa-clock text-slate-400"></i>
                        {% elif field.name == "docente_a_cargo" %}<i class="fa-solid fa-user-tie text-slate-400"></i>
                        {% else %}<i class="fa-solid fa-align-left text-slate-400"></i>{% endif %}
                        {{ field.label }}
                    </span>
                    {{ field }}
                    {% if field.errors %}<span class="mt-1 block text-xs font-semibold text-red-600">{{ field.errors|join:", " }}</span>{% endif %}
                </label>
                {% endfor %}
            </div>
            <div class="mt-6 flex justify-end gap-2 border-t border-slate-100 pt-5">
                <a href="{% url 'clases:clase_detail' clase.pk %}" class="inline-flex items-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50"><i class="fa-solid fa-xmark"></i>Cancelar</a>
                <button class="inline-flex items-center gap-2 rounded-xl bg-blue-700 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-800"><i class="fa-solid fa-calendar-plus"></i>Crear sesión</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
