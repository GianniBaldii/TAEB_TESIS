{% extends "layouts/principal.html" %}

{% block title %}Agregar alumno | TAEB{% endblock %}

{% block contenido %}
<section class="space-y-5">
    <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="border-b border-slate-100 bg-gradient-to-r from-blue-50 via-white to-slate-50 p-6">
            <div class="flex items-center gap-4">
                <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-700 text-xl text-white shadow-sm">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <div>
                    <a href="{% url 'clases:clase_detail' clase.pk %}" class="text-sm font-semibold text-blue-700 hover:text-blue-900"><i class="fa-solid fa-arrow-left mr-1"></i>Volver a {{ clase.nombre }}</a>
                    <h1 class="mt-1 text-2xl font-black text-slate-950">Agregar alumno</h1>
                    <p class="mt-1 text-sm text-slate-500">Solo aparecen alumnos activos de {{ clase.escuela }}.</p>
                </div>
            </div>
        </div>

        <form method="get" class="flex gap-2 p-5">
            <label class="relative flex-1">
                <span class="sr-only">Buscar alumno</span>
                <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input name="q" value="{{ busqueda }}" placeholder="Nombre, apellido o DNI" class="block w-full rounded-xl border border-slate-300 bg-white py-2.5 pl-10 pr-3 text-sm text-slate-900 shadow-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
            </label>
            <button class="inline-flex items-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50"><i class="fa-solid fa-search"></i>Buscar</button>
        </form>
    </div>

    <form method="post" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        {% csrf_token %}
        <div class="grid gap-5">
            {% for field in form %}
            <label>
                <span class="mb-1 flex items-center gap-2 text-sm font-bold text-slate-700">
                    {% if field.name == "alumno_escuela" %}<i class="fa-solid fa-user-graduate text-slate-400"></i>{% else %}<i class="fa-solid fa-align-left text-slate-400"></i>{% endif %}
                    {{ field.label }}
                </span>
                {{ field }}
                {% if field.errors %}<span class="mt-1 block text-xs font-semibold text-red-600">{{ field.errors|join:", " }}</span>{% endif %}
            </label>
            {% endfor %}
        </div>
        <div class="mt-6 flex justify-end gap-2 border-t border-slate-100 pt-5">
            <a href="{% url 'clases:clase_detail' clase.pk %}" class="inline-flex items-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50"><i class="fa-solid fa-xmark"></i>Cancelar</a>
            <button class="inline-flex items-center gap-2 rounded-xl bg-blue-700 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-800"><i class="fa-solid fa-user-plus"></i>Inscribir</button>
        </div>
    </form>
</section>
{% endblock %}
