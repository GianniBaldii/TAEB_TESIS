{% if estado == "PROGRAMADA" %}
<span class="inline-flex items-center gap-2 rounded-full border border-blue-200 bg-blue-50 px-3 py-1 text-xs font-bold text-blue-700"><i class="fa-solid fa-calendar-check"></i>Programada</span>
{% elif estado == "EN_CURSO" %}
<span class="inline-flex items-center gap-2 rounded-full border border-amber-200 bg-amber-50 px-3 py-1 text-xs font-bold text-amber-700"><i class="fa-solid fa-person-running"></i>En curso</span>
{% elif estado == "FINALIZADA" %}
<span class="inline-flex items-center gap-2 rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1 text-xs font-bold text-emerald-700"><i class="fa-solid fa-circle-check"></i>Finalizada</span>
{% elif estado == "CANCELADA" %}
<span class="inline-flex items-center gap-2 rounded-full border border-red-200 bg-red-50 px-3 py-1 text-xs font-bold text-red-700"><i class="fa-solid fa-ban"></i>Cancelada</span>
{% else %}
<span class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-slate-100 px-3 py-1 text-xs font-bold text-slate-700"><i class="fa-solid fa-circle-info"></i>{{ estado }}</span>
{% endif %}
