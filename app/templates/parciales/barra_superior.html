<header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="flex h-16 items-center gap-4 px-4 sm:px-6 lg:px-8">
        <button
            type="button"
            class="rounded-lg border border-slate-200 p-2 text-slate-600 hover:bg-slate-50 lg:hidden"
            aria-label="Abrir menú"
            @click="barraAbierta = true"
        >
            <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <div class="min-w-0">
            <p class="text-xs font-medium uppercase tracking-wider text-slate-400">
                TAEB
            </p>
            <h1 class="truncate text-lg font-semibold text-slate-900">
                {{ titulo_pagina|default:"Panel principal" }}
            </h1>
        </div>
    </div>
</header>
