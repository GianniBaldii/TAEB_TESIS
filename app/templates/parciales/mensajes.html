{% if messages %}
<div class="fixed inset-x-0 top-4 z-50 mx-auto w-full max-w-md px-4">
    {% for message in messages %}
    {% if "validation_error" not in message.tags %}
    <div class="mb-2 rounded-lg bg-slate-900 px-4 py-3 text-sm text-white shadow-lg">
        {{ message }}
    </div>
    {% endif %}
    {% endfor %}
</div>
{% endif %}
